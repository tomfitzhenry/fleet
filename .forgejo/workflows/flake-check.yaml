name: Nix Flake Check

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 3AM, Sunday.
    - cron: '0 3 * * *'
  workflow_dispatch:

enable-email-notifications: true

jobs:
  flake-check:
    # Uses a larger machine since the VM tests need more RAM/disk.
    runs-on: codeberg-medium-lazy
    container:
      image: nixos/nix:latest

    steps:
      - name: Enable flakes + experimental features
        run: |
          mkdir -p /etc/nix
          echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf

      - name: Install actions/checkout dependencies
        run: |
          # https://code.forgejo.org/actions/checkout
          nix-env -iA nixpkgs.nodejs_24

      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Run nix flake check
        run: nix flake check
